      properties:
        status:
          $ref: '#/components/schemas/StatusDecEnum'
        error_type:
          $ref: '#/components/schemas/UploadErrorResponseErrorTypeEnum'
        message:
          type: string
          description: Persian, user-facing error message.
        rows_processed:
          type: integer
          default: 0
        rows_saved:
          type: integer
          default: 0
      required:
      - error_type
      - message
      - status
    UploadErrorResponseErrorTypeEnum:
      enum:
      - file_error
      - mapping_error
      - duplicate_coupon_error
      type: string
      description: |-
        * `file_error` - file_error
        * `mapping_error` - mapping_error
        * `duplicate_coupon_error` - duplicate_coupon_error
    UploadHistoryItemResponse:
      type: object
      description: GET /api/v1/uploads/jobs/{job_id}/ — mirrors UploadJob.to_status_dict()
        exactly.
      properties:
        job_id:
          type: string
          format: uuid
        upload_type:
          $ref: '#/components/schemas/UploadTypeEnum'
        status:
          $ref: '#/components/schemas/Status166Enum'
        total_rows:
          type: integer
          nullable: true
          description: Null until the worker has finished counting rows in the file.
        processed_rows:
          type: integer
        rows_saved:
          type: integer
        progress_percentage:
          type: number
          format: double
          description: min(processed_rows, total_rows) / total_rows * 100, rounded
            to 2dp. 0.0 while total_rows is still null.
        error_type:
          type: string
          nullable: true
        message:
          type: string
          description: Persian status/result message.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        original_filename:
          type: string
        column_headers:
          type: array
          items:
            type: string
        download_url:
          type: string
          format: uri
      required:
      - column_headers
      - created_at
      - download_url
      - error_type
      - job_id
      - message
      - original_filename
      - processed_rows
      - progress_percentage
      - rows_saved
      - status
      - total_rows
      - updated_at
      - upload_type
    UploadJobNotFoundResponse:
