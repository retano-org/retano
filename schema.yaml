      description: GET /api/v1/uploads/jobs/{job_id}/ — mirrors UploadJob.to_status_dict()
        exactly.
      properties:
        job_id:
          type: string
          format: uuid
        upload_type:
          $ref: '#/components/schemas/UploadTypeEnum'
        status:
          $ref: '#/components/schemas/Status166Enum'
        total_rows:
