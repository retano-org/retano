          type: string
          format: date-time
      required:
      - created_at
      - error_type
      - job_id
      - message
      - processed_rows
      - progress_percentage
      - rows_saved
      - status
      - total_rows
      - updated_at
      - upload_type
    UploadTypeEnum:
      enum:
      - customers
      - products
      - coupons
      type: string
      description: |-
        * `customers` - customers
        * `products` - products
        * `coupons` - coupons
    ValueUnitEnum:
      enum:
      - روز
      - تومان
      type: string
      description: |-
        * `روز` - روز
        * `تومان` - تومان
    YearlyRetentionPoint:
      type: object
      description: |-
        One entry of core.utils.analytics.get_yearly_retention(). Shared by
        DashboardView's "monthly_trends" key (name is a known misnomer — the
        data is yearly, not monthly) and RetentionReportView's "years" key.
      properties:
        jalali_year:
          type: integer
        customers:
          type: integer
          description: Distinct customers with >=1 order in this Jalali year.
        retained:
          type: integer
          description: Of those customers, how many also ordered in jalali_year +
            1.
        retention_rate_percent:
          type: number
          format: double
        churn_rate_percent:
          type: number
          format: double
          description: 100 - retention_rate_percent.
      required:
      - churn_rate_percent
      - customers
      - jalali_year
      - retained
      - retention_rate_percent
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    syncApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Tenant Sync API Key
      description: 'Per-tenant sync API key for the ETL-facing endpoints under /api/v1/sync/
        (config fetch, data ingest, run reporting). This is NOT a JWT and is unrelated
        to the jwtAuth scheme used by every other endpoint in this API. Generate a
        key from the human-facing POST /api/v1/sync-conf/generate-key/ endpoint (JWT-authenticated),
        then supply it here as: Authorization: Bearer <api_key>. The key is enabled
        only after every field mapping row has been completed on the API-Conf page;
        a disabled or unknown key returns 401.'
