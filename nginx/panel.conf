## ── panel.retano360.com (backend) ──

## Only the production frontend origins may fetch media through browser APIs.
map $http_origin $media_cors_origin {
    default "";
    "https://retano360.com" $http_origin;
    "https://www.retano360.com" $http_origin;
}

server {

listen 80;

listen [::]:80;

server_name panel.retano360.com;

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location / {
    return 301 https://$host$request_uri;
}

}

server {

listen 443 ssl http2;

listen [::]:443 ssl http2;

server_name panel.retano360.com;

ssl_certificate     /etc/letsencrypt/live/retano360.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/retano360.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

client_max_body_size 100M;

location /static/ {
    alias /app/staticfiles/;
    expires 30d;
    access_log off;
}

location /media/ {
    alias /app/media/;
    expires 7d;
    access_log off;
    add_header Access-Control-Allow-Origin $media_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}

location / {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

}

## ── retano360.com (frontend, static SPA) ──

server {

listen 80;

listen [::]:80;

server_name retano360.com www.retano360.com;

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location / {
    return 301 https://$host$request_uri;
}

}

server {

listen 443 ssl http2;

listen [::]:443 ssl http2;

server_name retano360.com www.retano360.com;

ssl_certificate     /etc/letsencrypt/live/retano360.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/retano360.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

root /usr/share/nginx/app;
index index.html;

location ~ \.wasm$ {
    default_type application/wasm;
    expires 30d;
    access_log off;
}

location ~ \.(js|css|png|ico|json)$ {
    expires 30d;
    access_log off;
}

location / {
    try_files $uri $uri/ /index.html;
}

}

